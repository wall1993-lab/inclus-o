name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/enem-sheet-grader-jivort
    paths:
      - "app.py"
      - "gerador_cartoes.py"
      - "run_app.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar executavel unico (.exe)
        run: >
          pyinstaller --onefile --name PreparaENEM
          --collect-all streamlit
          --collect-all altair
          --collect-all reportlab
          --collect-all qrcode
          --collect-all fitz
          --collect-all PIL
          --add-data "app.py;."
          --add-data "gerador_cartoes.py;."
          run_app.py

      - name: Testar se o executavel abre sem travar
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\PreparaENEM.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 10
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:8501" -UseBasicParsing -TimeoutSec 5
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch {
              Write-Host "ainda nao respondeu, tentativa $i"
            }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "O executavel nao respondeu em http://localhost:8501 a tempo." }
          Write-Host "OK: o programa abriu e respondeu normalmente."

      - name: Enviar executavel como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PreparaENEM-windows
          path: dist/PreparaENEM.exe
          retention-days: 30
